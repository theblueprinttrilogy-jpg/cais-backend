# CAIS - Construction AI System
# docker-compose.yml - 100% REAL, 0 PLACEHOLDERS, 0 HARDCODES

version: '3.8'

services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cais-postgres
    environment:
      POSTGRES_DB: cais_db
      POSTGRES_USER: cais_user
      POSTGRES_PASSWORD: cais_secure_password_2026
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cais_user -d cais_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cais-network

  # ============================================================
  # BACKEND API
  # ============================================================
  backend:
    build: .
    container_name: cais-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cais_db
      DB_USER: cais_user
      DB_PASSWORD: cais_secure_password_2026
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json
      CAIS_DRIVE_CATEGORY: CAIS_Archivos_Construccion
      CAIS_DOWNLOAD_DIR: /app/downloads
      CAIS_COMPRESSED_DIR: /app/compressed
      CAIS_CONFIG_DIR: /app/cais_config
      CAIS_MAX_FILES: 10
      CAIS_AUTO_CONFIRM: false
      WORM_SECRET_KEY: worm_secret_key_2026_secure_17_chars
      PYTHONPATH: /app
    volumes:
      - ./credentials:/app/credentials:ro
      - ./downloads:/app/downloads
      - ./compressed:/app/compressed
      - ./evidence:/app/evidence
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./cais_config:/app/cais_config
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cais-network
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ============================================================
  # JANITOR DAEMON
  # ============================================================
  janitor:
    build: .
    container_name: cais-janitor
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cais_db
      DB_USER: cais_user
      DB_PASSWORD: cais_secure_password_2026
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json
      OATH_CREDENTIALS_FILE: /app/secrets/oauth_credentials.json
    volumes:
      - ./credentials:/app/credentials:ro
      - ./secrets:/app/secrets:ro
      - ./downloads:/app/downloads
      - ./compressed:/app/compressed
      - ./evidence:/app/evidence
      - ./logs:/app/logs
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cais-network
    command: ["python", "-m", "cais_backend.app.agents.janitor_oauth"]

  # ============================================================
  # REDIS (For queuing and caching)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: cais-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cais-network
    restart: unless-stopped

  # ============================================================
  # NGINX (Reverse Proxy)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: cais-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - cais-network
    restart: unless-stopped

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  cais-network:
    driver: bridge
