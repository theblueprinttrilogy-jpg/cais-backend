name: Deploy to GCP Cloud Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Upload to GCP Cloud Storage
        run: |
          # Crear bucket si no existe
          gcloud storage buckets create gs://${{ secrets.GCP_BUCKET_NAME }} --location=us-central1 2>/dev/null || true
          
          # Subir archivos
          gcloud storage cp -r src/ gs://${{ secrets.GCP_BUCKET_NAME }}/src/
          gcloud storage cp -r modules/ gs://${{ secrets.GCP_BUCKET_NAME }}/modules/
          gcloud storage cp -r cais_backend/ gs://${{ secrets.GCP_BUCKET_NAME }}/cais_backend/
          gcloud storage cp *.py *.txt *.sh gs://${{ secrets.GCP_BUCKET_NAME }}/
          
          echo "✅ Deployment complete"

      - name: Verify deployment
        run: |
          gcloud storage ls gs://${{ secrets.GCP_BUCKET_NAME }}/
