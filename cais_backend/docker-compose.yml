version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cais-postgres
    user: postgres
    environment:
      POSTGRES_USER: cais
      POSTGRES_PASSWORD: Cais1234
      POSTGRES_DB: cais_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cais -d cais_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cais-network

  redis:
    image: redis:alpine
    container_name: cais-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cais-network

  backend:
    build: .
    container_name: cais-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      HF_HUB_OFFLINE: 1
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cais-network

  worker:
    build: .
    container_name: cais-backend-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      HF_HUB_OFFLINE: 1
      # Ingestion worker specific variables (can be overridden)
      INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-50}
      INGESTION_INTERVAL: ${INGESTION_INTERVAL:-60}
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./config:/app/config
    command: python3 -m app.workers.ingestion_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cais-network

  janitor:
    build: .
    container_name: cais-backend-janitor
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JANITOR_INTERVAL: ${JANITOR_INTERVAL:-3600}
      JANITOR_MAX_AGE_DAYS: ${JANITOR_MAX_AGE_DAYS:-45}
      JANITOR_ROOT_FOLDER: ${JANITOR_ROOT_FOLDER:-JACINTO_CORREA_COMPUTER}
      JANITOR_TEMP_DIR: /app/data/temp
      JANITOR_DATA_DIR: /app/data
      JANITOR_LOG_FILE: /app/logs/janitor.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: python3 -m app.agents.start_janitor_daemon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cais-network

volumes:
  postgres_data:
    driver: local

networks:
  cais-network:
    driver: bridge
