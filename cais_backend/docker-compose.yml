services:
  postgres:
    image: pgvector/pgvector:pg15

    container_name: cais-postgres
    environment:
      POSTGRES_USER: cais
      POSTGRES_PASSWORD: Cais1234
      POSTGRES_DB: cais_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cais -d cais_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cais-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cais-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cais-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cais-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/google-service-account.json
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
      - ./credentials:/app/credentials:ro
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cais-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cais-worker
    command: python -m app.workers.ingestion_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/google-service-account.json
    volumes:
      - ./app:/app/app
      - ./credentials:/app/credentials:ro
      - /tmp/cais_uploads:/tmp/cais_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cais-network
    restart: unless-stopped

  janitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cais-janitor
    command: python -m app.workers.janitor_daemon
    environment:
      DATABASE_URL: postgresql+asyncpg://cais:Cais1234@postgres:5432/cais_db
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/google-service-account.json
    volumes:
      - ./app:/app/app
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cais-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cais-network:
    driver: bridge
