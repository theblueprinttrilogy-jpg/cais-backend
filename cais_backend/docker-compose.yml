version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cais-postgres
    user: postgres
    environment:
      POSTGRES_USER: cais
      POSTGRES_PASSWORD: Cais1234
      POSTGRES_DB: cais_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cais -d cais_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cais-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: cais-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      HF_HUB_OFFLINE: 1
      # Additional configuration variables
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: INFO
      API_PREFIX: /api/v1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: cais-backend-worker
    environment:
      DATABASE_URL: postgresql://cais:Cais1234@postgres:5432/cais_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      HF_HUB_OFFLINE: 1
      # Additional configuration variables for worker
      INGESTION_SLEEP_INTERVAL: 300
      INGESTION_TARGETS: "Florida Building Code,International Residential Code,fire safety,structural wind loads,electrical standards"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./config.py:/app/config.py
    command: python3 -m app.workers.ingestion_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
